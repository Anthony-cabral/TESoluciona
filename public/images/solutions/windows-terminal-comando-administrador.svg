<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Administrator terminal mockup</title>
  <desc id="desc">Original Tesoluciona lab mockup showing an elevated Windows terminal with system repair commands.</desc>
  <rect width="1280" height="720" fill="#f1f5f9"/>
  <rect x="110" y="88" width="1060" height="540" rx="16" fill="#101827"/>
  <rect x="110" y="88" width="1060" height="48" rx="16" fill="#1e293b"/>
  <circle cx="146" cy="112" r="8" fill="#ef4444"/>
  <circle cx="174" cy="112" r="8" fill="#f59e0b"/>
  <circle cx="202" cy="112" r="8" fill="#22c55e"/>
  <text x="230" y="119" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e1">Administrador: Windows Terminal</text>
  <text x="150" y="194" font-family="Consolas, monospace" font-size="25" fill="#a7f3d0">C:\Windows\System32&gt; DISM.exe /Online /Cleanup-image /Restorehealth</text>
  <rect x="150" y="224" width="820" height="22" rx="4" fill="#0f766e"/>
  <text x="150" y="294" font-family="Consolas, monospace" font-size="25" fill="#e2e8f0">La operacion se completo correctamente.</text>
  <text x="150" y="366" font-family="Consolas, monospace" font-size="25" fill="#a7f3d0">C:\Windows\System32&gt; sfc /scannow</text>
  <rect x="150" y="398" width="620" height="22" rx="4" fill="#14b8a6"/>
  <text x="150" y="468" font-family="Consolas, monospace" font-size="25" fill="#e2e8f0">Proteccion de recursos no encontro infracciones.</text>
  <path d="M940 402 L1080 332 L1080 382 L1150 382 L1150 426 L1080 426 L1080 476 Z" fill="#f97316"/>
</svg>
