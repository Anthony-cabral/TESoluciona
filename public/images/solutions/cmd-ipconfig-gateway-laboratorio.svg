<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">ipconfig gateway mockup</title>
  <desc id="desc">Original Tesoluciona lab mockup showing ipconfig output with IPv4 and default gateway highlighted.</desc>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect x="96" y="80" width="1088" height="560" rx="16" fill="#0b1120"/>
  <text x="140" y="150" font-family="Consolas, monospace" font-size="25" fill="#d1fae5">C:\Users\Laboratorio&gt; ipconfig</text>
  <text x="140" y="220" font-family="Consolas, monospace" font-size="24" fill="#e5e7eb">Adaptador de LAN inalambrica Wi-Fi:</text>
  <text x="170" y="280" font-family="Consolas, monospace" font-size="23" fill="#cbd5e1">Direccion IPv4 . . . . . . . . . . . : 192.168.1.25</text>
  <text x="170" y="330" font-family="Consolas, monospace" font-size="23" fill="#cbd5e1">Mascara de subred . . . . . . . . . : 255.255.255.0</text>
  <text x="170" y="380" font-family="Consolas, monospace" font-size="23" fill="#cbd5e1">Puerta de enlace predeterminada . . : 192.168.1.1</text>
  <rect x="152" y="250" width="720" height="148" rx="10" fill="none" stroke="#f97316" stroke-width="8"/>
  <path d="M910 326 L1080 250 L1080 302 L1160 302 L1160 350 L1080 350 L1080 402 Z" fill="#f97316"/>
  <text x="140" y="490" font-family="Arial, sans-serif" font-size="22" fill="#93c5fd">Anota IPv4 y puerta de enlace del adaptador activo.</text>
</svg>
