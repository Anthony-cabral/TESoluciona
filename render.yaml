services:
  - type: web
    name: tesoluciona-preview
    runtime: node
    branch: feature/public-solutions-mvp
    plan: free
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_NAME
        value: Tesoluciona
      - key: NEXT_PUBLIC_APP_VERSION
        value: 0.1.0
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
